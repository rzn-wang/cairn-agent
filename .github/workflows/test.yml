name: test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the selftest reads git history
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: git identity (the graph selftest makes commits in a temp repo)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - run: npm test
        env:
          CAIRN_DISTILL: mechanical
      - run: npm pack --dry-run
